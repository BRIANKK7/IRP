<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />
  <script src="config.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IRP</title>

  <style>

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    
    input[type="number"] {
        appearance: textfield;
    }
    :root{

      --bg:#f5f7fb;

      --panel:#ffffff;

      --line:#e7ebf3;

      --text:#1f2937;

      --sub:#6b7280;

      --blue:#2563eb;

      --blue-soft:#eff6ff;

--up:#dc2626;

--down:#2563eb;

      --shadow:0 8px 24px rgba(15,23,42,0.06);

      --radius:18px;

      --holding-cols: 220px 62px 64px 78px 68px 76px 48px 72px 57px 27px;

    }


 

    *{box-sizing:border-box}

    body{

      margin:0;

      font-family: "Segoe UI", Arial, sans-serif;

      background:var(--bg);

      color:var(--text);

    }


 

    .app{

      max-width:1900px;

      margin:0 auto;

      padding:20px 20px 40px;

    }


 

.topbar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:6px;

  margin-bottom:6px;

}


 

.title-wrap h1{

  margin:0;

  font-size:26px;

  font-weight:800;

  letter-spacing:-0.02em;

  line-height:1.1;

}


 

    .title-wrap p{

      margin:6px 0 0;

      color:var(--sub);

      font-size:13px;

    }


 

    .panel{

      background:var(--panel);

      border:1px solid var(--line);

      border-radius:var(--radius);

      box-shadow:var(--shadow);

    }


 

.toolbar{

  padding:4px 0 10px;

  margin-bottom:12px;

}


 

.toolbar-grid{

  display:grid;

  grid-template-columns: 1fr;

  gap:4px;

  align-items:center;

}


 

.toolbar-block{

  border:none;

  border-radius:0;

  padding:4px 0;

  background:transparent;

}

.toolbar-title{

  font-size:12px;

  font-weight:600;

  color:#475569;

  margin-bottom:0;

  white-space:nowrap;

  line-height:1;

  margin-right:2px;

}


 

.inline-form{

  display:flex;

  flex-wrap:nowrap;

  gap:8px;

  align-items:center;

  width:100%;

}


 

.inline-form input,

.inline-form select{

  height:32px;

  border:1px solid var(--line);

  background:white;

  border-radius:8px;

  padding:0 8px;

  font-size:13px;

  color:var(--text);

  min-width:80px;

}

.input-name{ width:240px; }
.input-small{ width:60px; }
.input-mid{ width:90px; }
.input-price{ width:130px; }
.input-category{ width:160px; }  /* ← 이 줄 추가 */

 

.check-inline{

  display:flex;

  flex-wrap:wrap;

  gap:6px;

  align-items:flex-start;

  justify-content:flex-start;

  align-content:flex-start;

  margin-left:0;

  overflow:visible;

  max-width:none;

  flex:0 1 auto;

}
 

 

.check-chip{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:8px;

  width:110px;

  min-width:110px;

  height:32px;

  padding:0 10px;

  border:1px solid var(--line);

  border-radius:999px;

  background:#f8fafc;

  font-size:12px;

  color:#374151;

  white-space:nowrap;

  overflow:hidden;

  cursor:pointer;

}

.big-category-row{
  display:flex;
  gap:8px;
  margin-top:0px;
  flex-wrap:nowrap;
}

.big-category-chip{
  flex:1;
  min-width:0;
  border:1px solid #a7aeb8;
  background:#f8fafc;
  border-radius:12px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.big-category-chip.big-overseas{
  background:rgba(250, 126, 11, 0.10);
}

.big-category-chip.big-domestic{
  background:rgba(83, 255, 30, 0.10);
}

.big-category-chip.big-gold{
  background:rgba(255, 233, 34, 0.10);
}

.big-category-chip.big-cash{
  background:rgba(57, 133, 255, 0.12);
}

.big-category-chip.big-overseas .big-category-value{ color:#b45309; }
.big-category-chip.big-domestic .big-category-value{ color:#15803d; }
.big-category-chip.big-gold .big-category-value{ color:#a16207; }
.big-category-chip.big-cash .big-category-value{ color:#1d4ed8; }

.big-category-name{
  font-size:12px;
  color:#475569;
  margin-bottom:4px;
  white-space:nowrap;
}

.big-category-value{
  font-size:16px;
  font-weight:700;
  color:#1f2937;
  white-space:nowrap;
}

.check-chip .account-check{

  position:absolute;

  opacity:0;

  pointer-events:none;

}

.check-chip .account-check:checked + .fake-check{

  background:#2563eb;

  border-color:#2563eb;

}

.check-chip .account-check:checked + .fake-check::after{

  content:'';

  position:absolute;

  left:3px;

  top:0px;

  width:4px;

  height:8px;

  border:solid #fff;

  border-width:0 2px 2px 0;

  transform:rotate(45deg);

}


 


 

.fake-check{

  width:14px;

  height:14px;

  min-width:14px;

  border:1.5px solid #94a3b8;

  border-radius:3px;

  background:#fff;

  display:block;

  position:relative;

}


 

.check-chip-text{

  flex:1;

  min-width:0;

  text-align:left;

  line-height:1;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


 


 

button{

  border:none;

  border-radius:8px;

  background:var(--blue);

  color:white;

  cursor:pointer;

  font-size:13px;

  font-weight:700;

  height:32px;

  padding:0 10px;

}


 

    button:hover{ filter:brightness(0.97); }


 

    .btn-light{

      background:#eef2ff;

      color:#334155;

      border:1px solid var(--line);

    }


 

    .btn-ghost{

      background:transparent;

      color:#64748b;

      border:1px solid var(--line);

    }


 

    .btn-danger{

      background:#fff1f2;

      color:#b42318;

      border:1px solid #fecdd3;

    }


 .bulk-price-input{
  width:180px;
  min-width:180px;
  max-width:180px;
  height:32px;
  min-height:32px;
  max-height:32px;
  resize:none;
  overflow-y:auto;
  overflow-x:hidden;
  border:1px solid var(--line);
  background:white;
  border-radius:8px;
  padding:6px 8px;
  font-size:12px;
  color:var(--text);
  line-height:1.2;
  font-family:"Segoe UI", Arial, sans-serif;
  white-space:pre-wrap;
}

    .summary-panel{

      padding:16px;

      margin-bottom:18px;

    }


 

    .section-head{

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:12px;

      margin-bottom:14px;

    }


 

    .section-head h2{

      margin:0;

      font-size:18px;

      font-weight:700;

      letter-spacing:-0.02em;

    }


 

    .summary-badges{

      display:flex;

      flex-wrap:wrap;

      gap:10px;

      margin-bottom:14px;

    }


 

.badge{

  background:var(--blue-soft);

  color:#1d4ed8;

  padding:10px 14px;

  border-radius:999px;

  font-size:13px;

  font-weight:500;

}


 

.pos{ color:var(--up); font-weight:500; }

.neg{ color:var(--down); font-weight:500; }

    .muted{ color:var(--sub); }


 

    .table-wrap{

      overflow:auto;

      border:1px solid var(--line);

      border-radius:14px;

    }


 

    table{

      width:100%;

      border-collapse:collapse;

      background:white;

    }


 

th, td{

  padding:10px 8px;

  font-size:12px;

  border-bottom:1px solid #eef2f7;

  text-align:right;

  white-space:nowrap;

}

 

th{

  background:#f8fafc;

  color:#475569;

  font-weight:800;

  cursor:pointer;

  user-select:none;

}


 

    .accounts-section{

      margin-top:20px;

    }


 .accounts-top {

  justify-content: space-between;
  margin-bottom: 12px;
  gap: 10px;
  flex-wrap: wrap;
}

.accounts-top-left {

    .mini-add input{

      height:34px;

      border:1px solid var(--line);

      border-radius:10px;

      padding:0 10px;

      width:180px;

      font-size:13px;

    }


 

    .mini-add button{

      height:34px;

      padding:0 10px;

    }


 

.accounts-grid{

  display:grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap:14px;

  align-items:start;

}


 

    .account-card{

      background:var(--panel);

      border:1px solid var(--line);

      border-radius:18px;

      box-shadow:var(--shadow);

      overflow:hidden;

      min-height:320px;

    }


 

.account-card-header{

  padding:10px 14px 8px;

  border-bottom:1px solid #eef2f7;

  background:linear-gradient(to bottom, #ffffff, #fbfdff);

}


 

.account-topline{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;

  margin-bottom:0;

}


 

.account-name{

  font-size:16px;

  font-weight:600;

  line-height:1;

  word-break:keep-all;

}


 

.account-actions{

  display:flex;

  gap:6px;

  flex-shrink:0;

  align-items:center;

}


 

.icon-btn{

  height:26px;

  min-width:28px;

  padding:0 8px;

  border-radius:8px;

  font-size:12px;

  font-weight:700;

}


 


 

    .account-metrics{

  display:grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap:8px;

}


 

.metric{

  background:#f8fafc;

  border:1px solid #edf2f7;

  border-radius:10px;

  padding:6px 8px;

}


 

.metric-label{

  font-size:11px;

  color:var(--sub);

  margin-bottom:2px;

}


 

.metric-value{

  font-size:12px;

  font-weight:500;

}


 

.account-body{

  padding:10px;

  overflow-x:auto;

}

.topbar-actions{

  display:flex;

  gap:8px;

  align-items:center;

}

.holding-list{

  display:flex;

  flex-direction:column;

  gap:0px;

}

.global-name-head{



  width:280px;

}


 

.global-name-cell{

  width:280px;

  max-width:280px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


 


 

.global-summary-layout{

  display:grid;

  grid-template-columns: minmax(0, 1fr) 520px;

  gap:18px;

  align-items:start;

}

.global-summary-side{

  display:flex;

  flex-direction:column;

  gap:8px;

}


 

.global-summary-side .badge{

  width:100%;

  border-radius:16px;

  text-align:left;

  padding:14px 16px;

  font-size:15px;

}


 

.global-name-col{

  text-align:left !important;

  cursor:pointer;

}

.global-table-compact th,

.global-table-compact td{

  padding:10px 8px;

  font-size:13px;

}


 

#globalTable th:last-child,

#globalTable td:last-child{

}


 

.holding-item{

  border:1px solid #e9edf5;

  border-radius:10px;

  padding:4px 6px;

  min-height:auto;

}

.holding-item.dragging{
  opacity:0.4;
}

.holding-item.drop-before{
  box-shadow:inset 0 3px 0 0 #2563eb;
}

.holding-item.drop-after{
  box-shadow:inset 0 -3px 0 0 #2563eb;

.holding-row-1{

  grid-template-columns: var(--holding-cols);

  gap:12px;

  align-items:center;

}


 

.holding-row-2{

  display:none;

}


 

.holding-header{

  display:grid;

  grid-template-columns: var(--holding-cols);

.holding-header div{

.actual-investment-edit{

}


 

.holding-row-1 .hcell{

.account-summary-inline{

.account-summary-inline span{

.current-price-label{

.global-side-panel{

.compare-bars{

.compare-label{

.weight-value{

@media (max-width: 1200px){

  .toolbar-grid{ grid-template-columns: 1fr; }

      .accounts-grid{ grid-template-columns: 1fr; }

  /* 티커 관리 모달 */
  .ticker-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  .ticker-modal-overlay.active { display: flex; }
  .ticker-modal-inner {
    background: #fff; padding: 20px 22px; border-radius: 12px;
    width: 560px; max-width: 92vw; max-height: 85vh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .ticker-modal-inner h3 { margin: 0 0 8px 0; }
  .ticker-modal-inner .hint { font-size: 12px; color: #6b7280; margin-bottom: 10px; }

    (function(){
      var __gasReqId = 0;
      var __gasPending = {};
      window.callGas = function(method) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function(resolve, reject){
          var reqId = ++__gasReqId;
          __gasPending[reqId] = { resolve: resolve, reject: reject };
          try {
            window.parent.postMessage({ type: 'gasRun', method: method, args: args, reqId: reqId }, '*');
          } catch (e) {
            delete __gasPending[reqId];
            reject(e);
          }
        });
      };
      window.addEventListener('message', function(e){
        var d = e.data;
        if (!d || d.type !== 'gasResult') return;
        var p = __gasPending[d.reqId];
        if (!p) return;
        delete __gasPending[d.reqId];
        if (d.success) p.resolve(d.data);
        else p.reject(new Error(d.error || 'GAS 호출 실패'));
      });

      try {

        if (initMode === 'mobile' || initMode === 'pc') {
          localStorage.setItem('irp_deviceView', initMode);
        }
      } catch (e) {}

      function applyIrpView() {
        var mode = 'pc';
        try {
          var saved = localStorage.getItem('irp_deviceView');
          if (saved === 'mobile') mode = 'mobile';
        } catch (e) {}
        if (mode === 'mobile') {
          document.body.classList.add('view-mobile');
        } else {
          document.body.classList.remove('view-mobile');
        }
        var btn = document.getElementById('irpViewToggle');

      window.toggleIrpView = function() {

        try {
          if (localStorage.getItem('irp_deviceView') === 'mobile') current = 'mobile';
        } catch (e) {}
        var next = current === 'mobile' ? 'pc' : 'mobile';
        try { localStorage.setItem('irp_deviceView', next); } catch (e) {}
        applyIrpView();
      };
      // 부모(main.html) postMessage 동기화

            setTimeout(applyIrpView, 100);
            setTimeout(applyIrpView, 500);

 function getProductNameType(name) {
  const firstChar = (name || '').trim().charAt(0);
  if (!firstChar) return 3;

  if (/[0-9]/.test(firstChar)) return 0;
  if (/[A-Za-z]/.test(firstChar)) return 1;
  if (/[가-힣]/.test(firstChar)) return 2;
  return 3;
}

function sortProductNamesForBulk(names) {
  return [...names].sort((a, b) => {
    const typeA = getProductNameType(a);
    const typeB = getProductNameType(b);

    if (typeA !== typeB) return typeA - typeB;

    if (typeA === 1) {
      return a.localeCompare(b, 'en', { sensitivity: 'base' });
    }

    return a.localeCompare(b, 'ko');
  });
}

let dragHoldingCtx = null;

function onHoldingDragStart(e, accountId, holdingId) {
  dragHoldingCtx = { accountId, holdingId };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', holdingId); } catch (_) {}
  const item = e.target.closest('.holding-item');
  if (item) {
    item.classList.add('dragging');
    try { e.dataTransfer.setDragImage(item, 20, 10); } catch (_) {}
  }
}

function onHoldingDragOver(e, accountId) {
  if (!dragHoldingCtx || dragHoldingCtx.accountId !== accountId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const item = e.currentTarget;
  if (item.dataset.holdingId === dragHoldingCtx.holdingId) return;
  const rect = item.getBoundingClientRect();
  const isAfter = (e.clientY - rect.top) > rect.height / 2;
  item.classList.toggle('drop-after', isAfter);
  item.classList.toggle('drop-before', !isAfter);
}

function onHoldingDragLeave(e) {
  const item = e.currentTarget;
  item.classList.remove('drop-before');
  item.classList.remove('drop-after');
}

function onHoldingDrop(e, accountId, targetHoldingId) {
  e.preventDefault();
  const item = e.currentTarget;
  const wasAfter = item.classList.contains('drop-after');
  item.classList.remove('drop-before');
  item.classList.remove('drop-after');

  if (!dragHoldingCtx || dragHoldingCtx.accountId !== accountId) return;
  const sourceHoldingId = dragHoldingCtx.holdingId;
  dragHoldingCtx = null;
  if (sourceHoldingId === targetHoldingId) return;

  const account = data.accounts.find(a => a.id === accountId);
  if (!account) return;
  const fromIdx = account.holdings.findIndex(h => h.id === sourceHoldingId);
  let toIdx = account.holdings.findIndex(h => h.id === targetHoldingId);
  if (fromIdx < 0 || toIdx < 0) return;

  const [moved] = account.holdings.splice(fromIdx, 1);
  if (fromIdx < toIdx) toIdx -= 1;
  if (wasAfter) toIdx += 1;
  account.holdings.splice(toIdx, 0, moved);
  renderAll();
}

function onHoldingDragEnd(e) {
  dragHoldingCtx = null;
  document.querySelectorAll('.holding-item.dragging, .holding-item.drop-before, .holding-item.drop-after').forEach(el => {
    el.classList.remove('dragging');
    el.classList.remove('drop-before');
    el.classList.remove('drop-after');
  });
}

function getCategoryPieChart(global) {

  const sortedEntries = Object.entries(categoryTotals)
    .sort((a, b) => b[1] - a[1]);
  
  const total = Object.values(categoryTotals).reduce((a, b) => a + b, 0);
  if (total === 0) return '<text x="110" y="110" text-anchor="middle" fill="#999">데이터 없음</text>';

  const colors = ['#ff9580', '#ffc95e', '#f7f76a', '#99f09e', '#94dbff', '#919cff', '#DD99FF'];
  let currentAngle = -90;
  let svgPaths = '';

  sortedEntries.forEach(([cat, amount], idx) => {
    const percentage = (amount / total) * 100;
    const angle = (percentage / 100) * 360;
    const startRad = (currentAngle * Math.PI) / 180;
    const endRad = ((currentAngle + angle) * Math.PI) / 180;

    const x1 = 110 + 70 * Math.cos(startRad);
    const y1 = 110 + 70 * Math.sin(startRad);
    const x2 = 110 + 70 * Math.cos(endRad);
    const y2 = 110 + 70 * Math.sin(endRad);

    const largeArc = angle > 180 ? 1 : 0;
    const pathData = `M 110 110 L ${x1} ${y1} A 70 70 0 ${largeArc} 1 ${x2} ${y2} Z`;

    svgPaths += `<path d="${pathData}" fill="${colors[idx % colors.length]}" stroke="white" stroke-width="2"/>`;
    currentAngle += angle;
  });

  return svgPaths;
}

async function exportData() {
  // 날짜를 YYMMDD 형식으로 (예: 260801)
  const now = new Date();
  const year = String(now.getFullYear()).slice(-2);
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const filename = `IRP${year}${month}${day}.json`;

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

  try {
    // 저장 위치를 사용자가 선택하도록
    const handle = await window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
    });
    const writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
    alert('저장 완료: ' + filename);
  } catch (err) {
    if (err.name !== 'AbortError') {
      alert('저장 오류: ' + err.message);
    }
  }
}

 function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);

      if (!imported.accounts || !imported.prices) {
        alert('올바른 JSON 파일이 아닙니다.');
        return;
      }

      if (!imported.categories) imported.categories = {};
      if (!imported.tickers) imported.tickers = {};

      imported.accounts.forEach(account => {
        if (!('actualInvestment' in account)) {
          account.actualInvestment = null;
        }
      });

      data = imported;
      renderAll();
      alert('불러오기 완료');
    } catch (err) {
      alert('파일을 읽는 중 오류가 발생했습니다.');
    }
  };

  reader.readAsText(file);
  event.target.value = '';
}

      ta.value.split(/\r?\n/).forEach(l => {
        const idx = l.indexOf('=');
        if (idx <= 0) return;
        const name = l.substring(0, idx).trim();
        const code = l.substring(idx + 1).trim();
        if (name && code) tickers[name] = code;
      });
      data.tickers = tickers;

    // ===== 시장지수 갱신 (나스닥/S&P500/코스피/달러환율) =====
    async function refreshMarketIndices() {
      try {
        if (typeof window.callGas !== 'function') return;
        const res = await window.callGas('fetchMarketIndices');
        if (!res) return;
        ['nasdaq','sp500','kospi','usdkrw','sox','gold','us10y','us30y'].forEach(key => {
          const info = res[key];
          const el = document.querySelector(`.mi-pill[data-key="${key}"]`);
          if (!el || !info) return;
          const value = Number(info.value);
          const change = Number(info.change);
          const valEl = el.querySelector('.mi-value');
          const chgEl = el.querySelector('.mi-change');
          if (isFinite(value)) {
            valEl.textContent = value.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
          chgEl.classList.remove('up','down');
          if (isFinite(change)) {
            const sign = change > 0 ? '▲' : change < 0 ? '▼' : '•';
            chgEl.textContent = `${sign} ${Math.abs(change).toFixed(2)}%`;
            if (change > 0) chgEl.classList.add('up');
            else if (change < 0) chgEl.classList.add('down');
          }
        });
      } catch (e) {
        console.warn('시장지수 갱신 실패:', e);
      }
    }

    // ===== 실시간 가격 갱신 (Google Apps Script 프록시 경유) =====
    async function refreshAllPrices(silent = false) {
      if (!APPS_SCRIPT_URL) {
        if (!silent) alert('Apps Script 웹앱 URL이 설정되지 않았습니다.\n\nIRP.html 파일의 APPS_SCRIPT_URL 상수에 배포된 웹앱 URL을 입력하세요.');
        return;
      }

      if (!data.tickers || Object.keys(data.tickers).length === 0) {
        if (!silent) alert('먼저 [티커관리]에서 종목별 네이버 종목코드를 입력하세요.');
        return;
      }

      const entries = Object.entries(data.tickers);
      const codes = entries.map(([, c]) => c).join(',');

      const btns = document.querySelectorAll('button[onclick="refreshAllPrices()"]');
      const originalTexts = Array.from(btns).map(b => b.textContent);
      btns.forEach(b => { b.disabled = true; b.textContent = '⏳ 갱신 중...'; });

      const updated = [];
      const failed = [];

      try {
        if (typeof window.callGas !== 'function') {
          throw new Error('부모 callGas proxy 미초기화');
        }
        const priceMap = await window.callGas('fetchPrices', codes);

        // priceMap: { "005930": 71500, "069500": 33500, ... }
        entries.forEach(([name, code]) => {
          const price = priceMap[code];
          if (typeof price === 'number' && isFinite(price) && price > 0) {
            data.prices[name] = price;
            updated.push(`${name} → ${formatNumber(price)}원`);
          } else {
            failed.push(`${name} (${code})`);
          }
        });
      } catch (e) {
        btns.forEach((b, i) => { b.disabled = false; b.textContent = originalTexts[i]; });
        if (!silent) alert('갱신 실패: ' + e.message + '\n\nApps Script URL이 맞는지, 웹앱 접근 권한이 "모든 사용자" 인지 확인하세요.');
        else console.warn('실시간 갱신 실패(초기 자동):', e);
        return;
      } finally {
        btns.forEach((b, i) => { b.disabled = false; b.textContent = originalTexts[i]; });
      }

      saveData();
      renderAll();

      // 종목 갱신 시 시장지수도 함께 갱신
      refreshMarketIndices();

      if (silent) return;
      let msg = `${updated.length}개 갱신 완료`;
      if (failed.length > 0) msg += `\n실패: ${failed.length}개\n\n${failed.join('\n')}`;
      alert(msg);
    }

  </script>

  <!-- 하단 데이터 관리 툴바 (Save / Load / Reset) -->
  <div class="footer-tools" style="border-top:1px solid var(--line); margin-top:24px; padding:16px 20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
    <button class="btn-light" onclick="exportData()">💾 Save</button>
    <button class="btn-light" onclick="document.getElementById('importFile').click()">📂 Load</button>
    <button class="btn-danger" onclick="resetAllData()">🗑 Reset</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
  </div>

</body>

</html>
