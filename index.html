<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로이빈 자산관리</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <script src="config.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#6366f1', secondary: '#14b8a6', ledger: '#0f172a' } } }
        }
    </script>
    <style>
        /* number input 화살표 제거 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        input[type="number"] {
            appearance: textfield;
        }

        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .compact-table td, .compact-table th { padding: 0.5rem 0.4rem; }
        .compact-table th:first-child, .compact-table td:first-child { padding-left: 1.5rem; }
        .compact-table th:last-child, .compact-table td:last-child { padding-right: 1.5rem; }
        .sort-header { cursor: pointer; user-select: none; transition: background 0.2s; }
        .sort-header:hover { background-color: #f1f5f9; }
        .editable-cell:hover { background-color: #f8fafc; cursor: pointer; }
    </style>
    
    <!-- GAS 웹앱의 실제 주소를 가져와 전역 변수로 할당합니다. -->
    <script>
      window.APPS_SCRIPT_WEBAPP_URL = (typeof CONFIG !== "undefined" && CONFIG.APPS_SCRIPT_URL) || "";
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div id="root"></div>
<script type="text/babel">  
    const { useState, useEffect, useMemo, useRef } = React;

    // IRP(iframe) → 부모 GAS 호출 proxy — React 외부에서 즉시 등록되어야 함 (iframe 이 React useEffect 보다 먼저 postMessage 쏘기 때문)
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'gasRun') return;
        var method = e.data.method, args = e.data.args, reqId = e.data.reqId;
        var iframe = document.querySelector('iframe');
        var reply = function(success, payload) {
            try {
                var w = iframe && iframe.contentWindow;
                if (w) w.postMessage({ type: 'gasResult', reqId: reqId, success: success, data: success ? payload : undefined, error: success ? undefined : String((payload && payload.message) || payload) }, '*');
            } catch (err) {}
        };
        if (typeof google === 'undefined' || !google.script || !google.script.run || typeof google.script.run[method] !== 'function') {
            reply(false, 'google.script.run.' + method + ' 사용 불가');
            return;
        }
        try {
            var runner = google.script.run
                .withSuccessHandler(function(data) { reply(true, data); })
                .withFailureHandler(function(err) { reply(false, err); });
            runner[method].apply(runner, args || []);
        } catch (err) { reply(false, err); }
    });
    const ASSET_STORAGE_KEY = 'family_asset_flow_final';
    const LEDGER_STORAGE_KEY = 'family_main_ledger_v1';
    const MAN_TO_EOK = 10000;


const CardBenefitView = ({
    cards: liveCards, setCards: liveSetCards,
    history: liveHistory, setHistory: liveSetHistory,
    autoPayments, setAutoPayments,
    manualDone: liveManualDone, setManualDone: liveSetManualDone,
    deviceView, snapshots = {}, setSnapshots
}) => {
    const today = new Date();
    const currentYM = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

    const [selectedMonth, setSelectedMonth] = useState(currentYM);

    const isReadOnly = selectedMonth !== currentYM;
    const activeSnapshot = snapshots[selectedMonth];

    // 과거 월을 선택하면 그때 보관된 스냅샷을 그대로 보여주고, 이번달이면 실시간 데이터를 사용
    const cards = isReadOnly && activeSnapshot ? activeSnapshot.cards : liveCards;
    const history = isReadOnly && activeSnapshot ? activeSnapshot.history : liveHistory;
    const manualDone = isReadOnly && activeSnapshot ? (activeSnapshot.manualDone || {}) : liveManualDone;
    const setCards = isReadOnly ? () => {} : liveSetCards;
    const setHistory = isReadOnly ? () => {} : liveSetHistory;
    const setManualDone = isReadOnly ? () => {} : liveSetManualDone;

    // 매달 1일에 자동으로 지난달 내역을 스냅샷으로 보관하고 이번달을 초기화
    // (버튼을 누르지 않아도 한 번만 자동 실행)
    const autoClosedRef = useRef(false);
    useEffect(() => {
        if (autoClosedRef.current) return;
        if (!liveCards || liveCards.length === 0) return;
        if (!liveHistory) return;

        const monthsInHistory = Array.from(new Set(
            liveHistory.map(h => (h.date || '').substring(0, 7)).filter(Boolean)
        ));
        const prevMonths = monthsInHistory.filter(m => m && m < currentYM);
        const hasStaleManualDone = liveManualDone && Object.values(liveManualDone).some(v => v)
            && !liveHistory.some(h => (h.date || '').substring(0, 7) === currentYM);

        if (prevMonths.length === 0 && !hasStaleManualDone) {
            autoClosedRef.current = true;
            return;
        }
        autoClosedRef.current = true;

        if (prevMonths.length > 0) {
            const newSnapshots = {};
            prevMonths.forEach(ym => {
                const monthHist = liveHistory.filter(h => (h.date || '').substring(0, 7) === ym);
                newSnapshots[ym] = {
                    cards: JSON.parse(JSON.stringify(liveCards)),
                    history: JSON.parse(JSON.stringify(monthHist)),
                    manualDone: JSON.parse(JSON.stringify(liveManualDone || {}))
                };
            });
            if (setSnapshots) {
                setSnapshots(prev => ({ ...prev, ...newSnapshots }));
            }
            const currentHist = liveHistory.filter(h => (h.date || '').substring(0, 7) === currentYM);
            liveSetHistory(currentHist);
            liveSetCards(prev => prev.map(c => ({ ...c, curBenefit: c.curTarget || c.curBenefit })));
        }
        if (liveSetManualDone) liveSetManualDone({});
    }, [liveHistory, liveCards, liveManualDone]);

        const [payForm, setPayForm] = useState({
            date: new Date(Date.now() - (new Date().getTimezoneOffset() * 60000)).toISOString().substring(0, 10), 
            desc: '', 
            amt: '', 
            cardIdx: '', 
            opts: [] 
        });
        const [autoForm, setAutoForm] = useState({ day: '', desc: '', amt: '', cardIdx: '', opts: [] });
        const [modals, setModals] = useState({ config: false, history: false, autoList: false, totalHistory: false });
        const [selectedCard, setSelectedCard] = useState(null);
        const [selectedSlot, setSelectedSlot] = useState(null);
        const [collapsedCards, setCollapsedCards] = useState({});
        const collapseInitRef = useRef(false);

        const DISCOUNT_CATEGORIES = [
            { label: "인터넷쇼핑", keywords: ["인터넷쇼핑", "쿠팡 (로켓)"] },
            { label: "배달앱", keywords: ["배달앱"] },
            { label: "마트", keywords: ["마트"] },
            { label: "간편결제", keywords: ["간편결제", "KBPay", "KB Pay"] },
        ];
        const [selectedDiscountCategory, setSelectedDiscountCategory] = useState(null);

        useEffect(() => {
            const handleEsc = (e) => {
                if (e.key === 'Escape') {
                    setModals({ config: false, history: false, autoList: false });
                }
            };
            window.addEventListener('keydown', handleEsc);
            return () => window.removeEventListener('keydown', handleEsc);
        }, []);
        
        const [histEdit, setHistEdit] = useState({ id: null, field: null, value: '' });

        const toggleHistoryOpt = (id, sIdx) => {
            setHistory(prev => {
                return prev.map(item => {
                    if (item.id !== id) return item;

                    const newOpts = item.opts.includes(sIdx) 
                        ? item.opts.filter(o => o !== sIdx) 
                        : [...item.opts, sIdx];

                    const updatedItem = { ...item, opts: newOpts };
                    let totalBen = 0;
                    const slotBenefits = {};

                    let currentSlotSum = prev
                        .filter(h => h.id !== id && h.cardIdx === item.cardIdx)
                        .reduce((sum, h) => {
                            if (h.opts.includes(sIdx)) {
                                return sum + (h.isManualBenefit ? h.benefit : (h.slotBenefits?.[sIdx] || 0));
                            }
                            return sum;
                        }, 0);

                    if (updatedItem.isManualBenefit) {
                        if (newOpts.length > 0) {
                            slotBenefits[newOpts[0]] = updatedItem.benefit;
                        }
                    } else {
                        newOpts.forEach(optIdx => {
                            const s = getSetting(item.cardIdx, optIdx);
                            if (s.appMin > 0 && updatedItem.amt < s.appMin) {
                                slotBenefits[optIdx] = 0; return;
                            }
                            let recognized = (s.appMax > 0 && updatedItem.amt > s.appMax) ? s.appMax : updatedItem.amt;
                            let ben = Math.floor(recognized * (s.rate / 100));

                            if (s.limit > 0) {
                                const remaining = s.limit - currentSlotSum;
                                if (remaining <= 0) ben = 0;
                                else if (ben > remaining) ben = remaining;
                            }
                            slotBenefits[optIdx] = ben;
                            totalBen += ben;
                        });
                        updatedItem.benefit = totalBen;
                    }
                    updatedItem.slotBenefits = slotBenefits;
                    return updatedItem;
                });
            });
        };

        const updateHistoryItem = (id, field, value) => {
            setHistory(prev => {
                return prev.map(item => {
                    if (item.id !== id) return item;

                    const updatedItem = { ...item };

                    if (field === 'amt') {
                        updatedItem.amt = parseInt(value);
                        let totalBen = 0;
                        const slotBenefits = {};
                        const otherHist = prev.filter(h => h.id !== id && h.cardIdx === item.cardIdx);

                        item.opts.forEach(sIdx => {
                            const s = getSetting(item.cardIdx, sIdx);
                            if (s.appMin > 0 && updatedItem.amt < s.appMin) {
                                slotBenefits[sIdx] = 0; return;
                            }
                            let recognized = (s.appMax > 0 && updatedItem.amt > s.appMax) ? s.appMax : updatedItem.amt;
                            let ben = Math.floor(recognized * (s.rate / 100));

                            const currentSlotSum = otherHist
                                .filter(h => h.opts.includes(sIdx))
                                .reduce((sum, h) => {
                                    return sum + (h.isManualBenefit ? h.benefit : (h.slotBenefits?.[sIdx] || 0));
                                }, 0);

                            if (s.limit > 0) {
                                const remaining = s.limit - currentSlotSum;
                                if (remaining <= 0) ben = 0;
                                else if (ben > remaining) ben = remaining;
                            }
                            slotBenefits[sIdx] = ben;
                            totalBen += ben;
                        });
                        updatedItem.benefit = totalBen;
                        updatedItem.slotBenefits = slotBenefits;
                        updatedItem.isManualBenefit = false;

                    } else if (field === 'benefit') {
                        updatedItem.benefit = parseInt(value);
                        updatedItem.isManualBenefit = true;
                    } else {
                        updatedItem[field] = value;
                    }
                    return updatedItem;
                });
            });
            setHistEdit({ id: null, field: null, value: '' });
        };

        const isItemPerf = (h) => {
            const card = cards[h.cardIdx];
            if (card && card.name.includes("헬로비전")) {
                // 헬로비전은 할인#1(인터넷요금, opts 0번)만 실적 제외, 나머지는 다 실적 포함
                return !(h.opts && h.opts.includes(0));
            }
            if (h.isPerf !== undefined) return !!h.isPerf;
            return card ? card.isPerf === "O" : true;
        };

        const getSetting = (cIdx, sIdx) => {
            const card = cards[cIdx];
            if (!card || cIdx === "") return { name: "-" };
            const tier = card.curBenefit || card.tiers[0];
            const key = `${sIdx}_${tier}`;
            return card.settings[key] || { name: "-", rate: 0, appMin: 0, appMax: 0, limit: 0 };
        };

        const pendingAuto = useMemo(() => {
            const today = new Date();
            const todayDay = today.getDate();
            const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            return autoPayments.filter(ap => 
                parseInt(ap.day) <= todayDay && ap.lastProcessed !== currentMonth
            );
        }, [autoPayments]);

        const processConfirmAuto = (ap, finalAmt) => {
            const today = new Date();
            const dateStr = today.toISOString().substring(0, 10);
            const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

            processAddHistory(dateStr, ap.desc, parseInt(finalAmt), ap.cardIdx, ap.opts);
            
            setAutoPayments(prev => prev.map(item => 
                item.id === ap.id ? { ...item, lastProcessed: currentMonth } : item
            ));
        };

        const processAddHistory = (date, desc, amt, cIdx, opts) => {
            const card = cards[cIdx];
            let totalBen = 0;
            let totalAppAmt = 0;
            let isPerf = card ? (card.isPerf === "O") : true;
            if (card && card.name.includes("헬로비전")) {
                // 헬로비전은 인터넷요금(할인#1, opts 0번)만 실적 제외, 나머지는 실적 포함
                isPerf = !(opts && opts.includes(0));
            }
            const slotBenefits = {};

            opts.forEach(sIdx => {
                const s = getSetting(cIdx, sIdx);
                if (s.appMin > 0 && amt < s.appMin) {
                    slotBenefits[sIdx] = 0;
                    return;
                }
                let recognizedAmt = (s.appMax > 0 && amt > s.appMax) ? s.appMax : amt;
                let ben = Math.floor(recognizedAmt * (s.rate / 100));

                const currentSlotBenSum = history
                    .filter(h => h.cardIdx == cIdx && h.opts.includes(sIdx))
                    .reduce((sum, h) => {
                        return sum + (h.isManualBenefit ? h.benefit : (h.slotBenefits?.[sIdx] || 0));
                    }, 0);

                if (s.limit > 0) {
                    const remaining = s.limit - currentSlotBenSum;
                    if (remaining <= 0) ben = 0;
                    else if (ben > remaining) ben = remaining;
                }
                slotBenefits[sIdx] = ben;
                totalBen += ben;
                totalAppAmt += recognizedAmt;
            });

            const newEntry = { 
                id: Date.now(), 
                date, 
                cardIdx: cIdx, 
                desc, 
                amt, 
                benefit: totalBen, 
                slotBenefits, 
                appliedAmt: totalAppAmt, 
                opts, 
                isPerf,
                isManualBenefit: false
            };
            setHistory(prev => [...prev, newEntry]);
        };

        const stats = useMemo(() => {
            return cards.map((c, cIdx) => {
                const cHist = history.filter(h => h.cardIdx == cIdx);
                const totalBenefit = cHist.reduce((s, h) => s + (h.benefit || 0), 0);
                
                // 실적 인정 금액 (헬로비전은 할인#1 인터넷요금만 제외, 나머지는 실적 포함)
                const totalPerfAmt = cHist.reduce((s, h) => {
                    if (c.name.includes("헬로비전")) {
                        if (h.opts && h.opts.includes(0)) return s;
                        return s + h.amt;
                    }
                    if (h.isPerf === false) return s;
                    return s + h.amt;
                }, 0);

                // 실적 제외 금액 (비실적 금액: 예: 헬로비전 인터넷요금 등)
                const totalNonPerfAmt = cHist.reduce((s, h) => {
                    if (c.name.includes("헬로비전")) {
                        if (h.opts && h.opts.includes(0)) return s + h.amt;
                        return s;
                    }
                    if (h.isPerf === false) return s + h.amt;
                    return s;
                }, 0);
                
                const slotBenefitSum = [0, 1, 2].map(sIdx => {
                    return cHist.reduce((sum, h) => {
                        if (h.opts.includes(sIdx)) {
                            return sum + (h.isManualBenefit ? h.benefit : (h.slotBenefits?.[sIdx] || 0));
                        }
                        return sum;
                    }, 0);
                });

                return { totalBenefit, totalPerfAmt, totalNonPerfAmt, slotBenefitSum };
            });
        }, [cards, history, selectedMonth]);

        const summaryStats = useMemo(() => {
            const totalSpend = stats.reduce((acc, s) => acc + s.totalPerfAmt, 0);
            const totalTierTarget = cards.reduce((acc, c) => acc + (c.curBenefit * 10000), 0);
            const totalNonPerf = stats.reduce((acc, s) => acc + (s.totalNonPerfAmt || 0), 0);
            const totalBenefit = stats.reduce((acc, s) => acc + s.totalBenefit, 0);
            // 피킹률 = 할인액 / (실적구간 + 비실적금액)
            const totalCost = totalTierTarget + totalNonPerf;
            const pickingRate = totalCost > 0 ? (totalBenefit / totalCost) * 100 : 0;
            return { totalSpend, totalTierTarget, totalBenefit, pickingRate };
        }, [stats, cards, selectedMonth]);

        // 모바일 진입 시 완료된 카드는 자동 접기 (최초 1회)
        useEffect(() => {
            if (collapseInitRef.current) return;
            if (!cards || cards.length === 0 || !stats) return;
            const initial = {};
            cards.forEach((c, i) => {
                const perf = stats[i]?.totalPerfAmt || 0;
                const isTargetDone = c.curTarget > 0 && perf >= c.curTarget * 10000;
                const isDone = isTargetDone || !!manualDone[i];
                if (isDone) initial[i] = true;
            });
            setCollapsedCards(initial);
            collapseInitRef.current = true;
        }, [cards, stats, manualDone]);

        return (
            <div key={selectedMonth} className="space-y-6 animate-in" style={{ fontSize: deviceView === 'mobile' ? '35px' : '12px' }}>
                {isReadOnly && (
                    <div className="bg-amber-100 border-l-4 border-amber-500 text-amber-800 p-2.5 rounded-xl font-bold text-[12px] mb-2 flex items-center justify-between">
                        <span>📌 {selectedMonth}월 마감 기록을 조회 중입니다. (과거 기록은 읽기 전용입니다)</span>
                        <button onClick={() => setSelectedMonth(currentYM)} className="bg-amber-600 text-white px-2 py-0.5 rounded text-[11px]">
                            이번달로 돌아가기
                        </button>
                    </div>
                )}
                {pendingAuto.length > 0 && (
                    <div className="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl shadow-sm">
                        <strong className="text-amber-700 block mb-3 font-bold">🔔 오늘 처리할 자동결제 내역</strong>
                        <div className="space-y-2">
                            {pendingAuto.map(ap => (
                                <div key={ap.id} className="bg-white p-3 rounded-xl border flex items-center justify-between gap-4">
                                    <span className="font-bold text-slate-700">[{cards[ap.cardIdx].name}] {ap.desc}</span>
                                    <div className="flex items-center gap-2">
                                        <input type="number" defaultValue={ap.amt} className="border rounded p-1 w-24 text-right" id={`pending-${ap.id}`} />
                                        <button onClick={() => processConfirmAuto(ap, document.getElementById(`pending-${ap.id}`).value)} className="bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold">입력</button>
                                        <button onClick={() => {
                                            const currentMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
                                            setAutoPayments(prev => prev.map(item => item.id === ap.id ? { ...item, lastProcessed: currentMonth } : item));
                                        }} className="bg-slate-200 text-slate-600 px-3 py-1 rounded-lg">이번달 취소</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                <div className={`${deviceView === 'mobile' ? 'flex flex-col gap-2' : 'flex items-stretch gap-4'}`} style={deviceView === 'mobile' ? {} : { marginBottom: '-8px' }}>
                    <div className={`${deviceView === 'mobile' ? 'flex flex-col gap-2 w-full' : 'flex gap-4 flex-1'}`}>
                        <div className="bg-white p-3 rounded-2xl border shadow-sm flex-[1.6]">
                            <div className="flex items-center gap-2 flex-wrap">
                                <strong className={`text-red-500 ${deviceView === 'mobile' ? 'text-[35px]' : 'text-[14px]'}`}>결제입력</strong>
                                <input type="date" className="border rounded p-1 ml-2" value={payForm.date}
                                    onChange={e => setPayForm({ ...payForm, date: e.target.value })} />
                                <input type="text" placeholder="내용" className="border rounded p-1" style={{ width: '120px' }} value={payForm.desc}
                                    onChange={e => setPayForm({ ...payForm, desc: e.target.value })} />
                                <input type="number" placeholder="금액" className="border rounded p-1" style={{ width: '90px' }}
                                    value={payForm.amt}
                                    onChange={e => setPayForm({ ...payForm, amt: e.target.value })} />
                                
                                <select className="border rounded p-1" value={payForm.cardIdx}
                                    onChange={e => setPayForm({ ...payForm, cardIdx: e.target.value, opts: [] })}>
                                    <option value="">카드선택</option>
                                    {cards.map((c, i) => <option key={i} value={i}>{c.name}</option>)}
                                </select>
                                
                                <div className="flex gap-2">
                                    {[0, 1, 2].map(i => {
                                        const s = getSetting(payForm.cardIdx, i);
                                        if (!s.name || s.name === "-") return null;
                                        return <label key={i} className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={payForm.opts.includes(i)} onChange={e => {
                                                const newOpts = e.target.checked ? [...payForm.opts, i] : payForm.opts.filter(o => o !== i);
                                                setPayForm({ ...payForm, opts: newOpts });
                                            }} />
                                            {s.name}
                                        </label>
                                    })}
                                </div>
                                
                                <button onClick={() => {
                                    if (!payForm.amt || payForm.cardIdx === "") return alert("금액과 카드를 선택하세요.");
                                    processAddHistory(payForm.date, payForm.desc, parseInt(payForm.amt), parseInt(payForm.cardIdx), payForm.opts);
                                    setPayForm({ ...payForm, desc: '', amt: '', opts: [] });
                                }} className="bg-slate-800 text-white px-4 py-1.5 rounded-lg ml-auto font-bold">입력</button>
                            </div>
                        </div>

                        {deviceView !== 'mobile' && (

                        toggleHistoryOpt={toggleHistoryOpt}
                        updateHistoryItem={updateHistoryItem}
                        setHistory={setHistory}
                        deviceView={deviceView}
                        onClose={() => setModals({...modals, totalHistory: false})}
                    />
                )}
            </div>
        );
    };

    const normalizeDate = (dateStr) => {
        if (!dateStr) return "";
        const cleanStr = dateStr.replace(/[\.\/]/g, '-');
        const parts = cleanStr.split('-');
        if (parts.length < 2) return dateStr; 
        const year = parts[0];
        const month = parts[1].padStart(2, '0'); 
        return `${year}-${month}`;
    };

        "수입": ["근로소득", "임대소득", "금융소득", "기타소득"],

            calendar: <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,

    const TotalHistoryModal = ({ history, cards, getSetting, toggleHistoryOpt, updateHistoryItem, setHistory, deviceView, onClose }) => {
        const [histEdit, setHistEdit] = useState({ id: null, field: null, value: '' });

        const isItemPerf = (h) => {
            const card = cards[h.cardIdx];
            if (card && card.name.includes("헬로비전")) {
                // 헬로비전은 할인#1(인터넷요금, opts 0번)만 실적 제외, 나머지는 다 실적 포함
                return !(h.opts && h.opts.includes(0));
            }
            if (h.isPerf !== undefined) return !!h.isPerf;
            return card ? card.isPerf === "O" : true;
        };

        const shortCardName = (name) => {
            if (!name) return '-';
            if (name.includes('미스터라이프')) return '미스터';
            if (name.includes('헬로비전')) return '헬로';
            if (name.includes('KB이지쇼핑')) return 'KB';
            if (name.includes('디카플랜')) return '디카';
            if (name.includes('MGS')) return '하나';
            if (name.includes('로카365')) return '로카';
            if (name.includes('새마을금고')) return '새말';

        return (

                <div className="bg-white rounded-3xl w-full max-h-[85vh] overflow-hidden flex flex-col shadow-2xl" style={{ maxWidth: '900px' }} onClick={e => e.stopPropagation()}>
                    <div className="p-6 border-b flex justify-between items-center bg-slate-50">

                        <button onClick={onClose} className="text-slate-400 text-2xl">&times;</button>
                    </div>
                    <div className="overflow-y-auto p-4 flex-1">
                        <table className={`w-full text-center ${deviceView === 'mobile' ? 'text-[20px]' : 'text-[11px]'}`}>
                            <thead className="bg-slate-50 font-bold text-slate-400">

                                    <th className="p-2">카드</th>

                                    <th className="p-2 text-right">금액</th>
                                    <th className="p-2 text-center">적용 혜택</th>
                                    <th className="p-2 text-right">할인액</th>
                                    {deviceView !== 'mobile' && <th className="p-2">실적</th>}
                                    {deviceView !== 'mobile' && <th className="p-2">삭제</th>}
                                </tr>
                            </thead>
                            <tbody className={`divide-y text-slate-700 ${deviceView === 'mobile' ? 'font-medium' : 'font-bold'}`}>
                                {[...history].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).map(h => (
                                    <tr key={h.id} className="hover:bg-slate-50">
                                        <td className="p-2 cursor-pointer" onDoubleClick={() => setHistEdit({ id: h.id, field: 'date', value: h.date })}>
                                            {histEdit.id === h.id && histEdit.field === 'date' ? <input autoFocus type="date" className="w-full border rounded" value={histEdit.value} onBlur={() => updateHistoryItem(h.id, 'date', histEdit.value)} onChange={e=>setHistEdit({...histEdit, value:e.target.value})} /> : (deviceView === 'mobile' && h.date && h.date.length >= 10 ? `${h.date.substring(5,7)}/${h.date.substring(8,10)}` : h.date)}
                                        </td>
                                        <td className="p-2">{deviceView === 'mobile' ? shortCardName(cards[h.cardIdx]?.name) : (cards[h.cardIdx]?.name || '-')}</td>
                                        <td className="p-2 text-left cursor-pointer" onDoubleClick={() => setHistEdit({ id: h.id, field: 'desc', value: h.desc })}>
                                            {histEdit.id === h.id && histEdit.field === 'desc' ? <input autoFocus className="w-full border rounded" value={histEdit.value} onBlur={() => updateHistoryItem(h.id, 'desc', histEdit.value)} onChange={e=>setHistEdit({...histEdit, value:e.target.value})} /> : h.desc}
                                        </td>
                                        <td className="p-2 text-right cursor-pointer" onDoubleClick={() => setHistEdit({ id: h.id, field: 'amt', value: h.amt })}>
                                            {histEdit.id === h.id && histEdit.field === 'amt' ? <input autoFocus type="number" className="w-full border rounded text-right" value={histEdit.value} onBlur={() => updateHistoryItem(h.id, 'amt', histEdit.value)} onChange={e=>setHistEdit({...histEdit, value:e.target.value})} /> : h.amt.toLocaleString()}
                                        </td>
                                        <td className="p-2">
                                            <div className="flex justify-center gap-1 flex-wrap">
                                                {[0, 1, 2].map(sIdx => {
                                                    const s = getSetting(h.cardIdx, sIdx);
                                                    if (s.name === "-") return null;
                                                    return <button key={sIdx} onClick={() => toggleHistoryOpt(h.id, sIdx)} className={`px-1.5 py-0.5 rounded border ${deviceView === 'mobile' ? 'text-[14px]' : 'text-[9px]'} ${h.opts.includes(sIdx) ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400'}`}>{s.name}</button>
                                                })}
                                            </div>
                                        </td>
                                        <td className="p-2 text-right text-indigo-600 editable-cell" onDoubleClick={() => setHistEdit({ id: h.id, field: 'benefit', value: h.benefit })}>
                                            {histEdit.id === h.id && histEdit.field === 'benefit' ?
                                                <input
                                                    autoFocus
                                                    type="number"
                                                    className="w-full border rounded text-right"
                                                    value={histEdit.value}
                                                    onBlur={() => updateHistoryItem(h.id, 'benefit', histEdit.value)}
                                                    onChange={e=>setHistEdit({...histEdit, value:e.target.value})}
                                                    onKeyDown={(e) => e.key === 'Enter' && updateHistoryItem(h.id, 'benefit', histEdit.value)}
                                                />
                                                :
                                                (h.benefit || 0).toLocaleString()}
                                        </td>
                                        {deviceView !== 'mobile' && (
                                            <td className="p-2 font-bold cursor-pointer hover:bg-slate-100" title="클릭하여 실적 반영 여부(O/X) 변경" onClick={() => updateHistoryItem(h.id, 'isPerf', !isItemPerf(h))}>
                                                <span className={isItemPerf(h) ? "text-emerald-600 font-black" : "text-rose-500 font-black"}>{isItemPerf(h) ? 'O' : 'X'}</span>
                                            </td>
                                        )}
                                        {deviceView !== 'mobile' && <td className="p-2"><button onClick={() => setHistory(prev => prev.filter(it=>it.id!==h.id))} className="text-red-400 text-xl font-bold">&times;</button></td>}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    };

    const REGULAR_ITEMS_STORAGE_KEY = 'family_regular_items_v1';
    const DEFAULT_REGULAR_ITEMS = [
        { mainCat: "수입", subCat: "근로소득", item: "근로소득", desc: "현석월급 (20일)", income: 0, expense: 0 },
        { mainCat: "수입", subCat: "근로소득", item: "근로소득", desc: "은정월급 (22일)", income: 0, expense: 0 },
        { mainCat: "수입", subCat: "임대소득", item: "임대소득", desc: "반도 월세 (30일)", income: 300000, expense: 0 },
        { mainCat: "지출", subCat: "임대지출", item: "이자", desc: "반도 대출이자", income: 0, expense: 365000 },
        { mainCat: "수입", subCat: "임대소득", item: "임대소득", desc: "검암월세 (31일)", income: 1300000, expense: 0 },
        { mainCat: "지출", subCat: "임대지출", item: "이자", desc: "검암 대출이자", income: 0, expense: 965000 },
        { mainCat: "수입", subCat: "임대소득", item: "임대소득", desc: "엄마한테 받는 이자 (24일)", income: 500000, expense: 0 },
        { mainCat: "지출", subCat: "정기지출", item: "생활비", desc: "생활비", income: 0, expense: 2600000 },
        { mainCat: "지출", subCat: "정기지출", item: "교육", desc: "교육비 (영어52 + 아이캔두15 + 태권도31)", income: 0, expense: 980000 },
        { mainCat: "지출", subCat: "정기지출", item: "교육", desc: "등하교 돌봄비", income: 0, expense: 0 }
    ];

    const MainLedgerView = ({ ledger, setLedger, deviceView }) => {
        const [activeTab, setActiveTab] = useState('single');
        const [bulkText, setBulkText] = useState('');
        const [searchTerm, setSearchTerm] = useState('');
        const [filterMainCat, setFilterMainCat] = useState('전체');
        const [filterSubCat, setFilterSubCat] = useState('전체');
        const [filterItem, setFilterItem] = useState('전체');
        const [form, setForm] = useState({ date: '', mainCat: '지출', subCat: '정기지출', item: '', desc: '', income: '', expense: '', note: '' });
        const [filterStart, setFilterStart] = useState('');
        const [filterEnd, setFilterEnd] = useState('');
        const [showRegularModal, setShowRegularModal] = useState(false);
        const [regularItems, setRegularItems] = useState(() => {
            try {
                const saved = localStorage.getItem(REGULAR_ITEMS_STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return DEFAULT_REGULAR_ITEMS.map((it, idx) => ({ ...it, id: `reg-${idx}-${Date.now()}` }));
        });
        useEffect(() => {
            try { localStorage.setItem(REGULAR_ITEMS_STORAGE_KEY, JSON.stringify(regularItems)); } catch (e) {}
        }, [regularItems]);

        const handleCopyRowToForm = (r) => {
            setForm({
                date: r.date || '',
                mainCat: r.mainCat || '지출',
                subCat: r.subCat || '정기지출',
                item: r.item || '',
                desc: r.desc || '',
                income: r.income ? String(r.income) : '',
                expense: r.expense ? String(r.expense) : '',
                note: r.note || ''
            });
        };

        const [sortConfig, setSortConfig] = useState({ key: 'date_income_expense', direction: 'desc' });
        const [showSummary, setShowSummary] = useState(false);
        const [visibleYears, setVisibleYears] = useState(1);

        const handleAddRegular = () => {
            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const newEntries = regularItems.map(item => ({
                mainCat: item.mainCat,
                subCat: item.subCat,
                item: item.item,
                desc: item.desc,
                income: Number(item.income) || 0,
                expense: Number(item.expense) || 0,
                id: Math.random().toString(36).substring(2, 9),
                date: currentMonth,
                note: ""
            }));
            setLedger(prev => [...prev, ...newEntries]);
            alert(`${currentMonth} 정기 내역 ${newEntries.length}건이 추가되었습니다.`);
        };

        const updateRegularItem = (id, field, value) => {
            setRegularItems(prev => prev.map(it =>
                it.id === id
                    ? { ...it, [field]: (field === 'income' || field === 'expense') ? Number(value) || 0 : value }
                    : it
            ));
        };
        const deleteRegularItem = (id) => {
            setRegularItems(prev => prev.filter(it => it.id !== id));
        };
        const addRegularItem = () => {
            setRegularItems(prev => [
                ...prev,
                { id: `reg-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, mainCat: "지출", subCat: "정기지출", item: "생활비", desc: "새 항목", income: 0, expense: 0 }
            ]);
        };

        const [isSalaryVisible, setIsSalaryVisible] = useState(false);
        const [editState, setEditState] = useState({ id: null, field: null, value: '' });

        const handleAdd = (e) => {
            e.preventDefault();
            const newEntry = {
                ...form,
                id: Date.now().toString(),
                date: normalizeDate(form.date),
                income: Number(form.income)||0,
                expense: Number(form.expense)||0
            };
            setLedger(prev => [...prev, newEntry]);
            setForm({ ...form, item: '', desc: '', income: '', expense: '', note: '' });
        };

        const handleBulkSubmit = () => {
            try {
                const rows = bulkText.trim().split('\n');
                const records = [];
                for(let row of rows) {
                    const cols = row.split(/[\t,]/).map(c => c.trim());
                    if (cols[0].includes("날짜") || cols.length < 5) continue;
                    records.push({
                        id: Math.random().toString(36),
                        date: normalizeDate(cols[0]),
                        mainCat: cols[1] || '지출', subCat: cols[2] || '기타',
                        item: cols[3] || '', desc: cols[4] || '',
                        income: Number(cols[5]?.replace(/[^0-9.-]/g,'')) || 0,
                        expense: Number(cols[6]?.replace(/[^0-9.-]/g,'')) || 0,
                        note: cols[7] || ''
                    });
                }
                setLedger(prev => [...prev, ...records]);
                setBulkText(''); setActiveTab('single');
                alert(`${records.length}건 등록 완료`);
            } catch(e) { alert('데이터 형식이 잘못되었습니다.'); }
        };

        const requestSort = (key) => {
            let direction = 'desc';
            if (sortConfig.key === key && sortConfig.direction === 'desc') {
                direction = 'asc';
            }
            setSortConfig({ key, direction });
        };

        const updateEntry = (id, field, value) => {
            setLedger(prev => prev.map(item => {
                if (item.id === id) {
                    return { ...item, [field]: (field === 'income' || field === 'expense') ? Number(value) : value };
                }
                return item;
            }));
            setEditState({ id: null, field: null, value: '' });
        };

        const processedLedger = useMemo(() => {
            let filtered = [...ledger];
            if (filterStart) filtered = filtered.filter(r => r.date >= filterStart);
            if (filterEnd) filtered = filtered.filter(r => r.date <= filterEnd);
            if (filterMainCat && filterMainCat !== '전체') {
                filtered = filtered.filter(r => r.mainCat === filterMainCat);
            }
            if (filterSubCat && filterSubCat !== '전체') {
                filtered = filtered.filter(r => r.subCat === filterSubCat);
            }
            if (filterItem && filterItem !== '전체') {
                filtered = filtered.filter(r => r.item === filterItem);
            }
            if (searchTerm) {
                const lowSearch = searchTerm.toLowerCase();
                filtered = filtered.filter(r =>
                    r.item.toLowerCase().includes(lowSearch) ||
                    r.desc.toLowerCase().includes(lowSearch) ||
                    r.note?.toLowerCase().includes(lowSearch) ||
                    r.subCat.toLowerCase().includes(lowSearch)
                );
            }
            filtered.sort((a, b) => {
                if (sortConfig.key === 'date_income_expense') {
                    if (a.date !== b.date) return b.date.localeCompare(a.date);
                    if (b.income !== a.income) return b.income - a.income;
                    return b.expense - a.expense;
                }
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];
                if (typeof valA === 'number' && typeof valB === 'number') {
                    return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                }
                valA = String(valA); valB = String(valB);
                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });
            return filtered;
        }, [ledger, filterStart, filterEnd, sortConfig, searchTerm, filterMainCat, filterSubCat, filterItem]);

        const visibleLedger = useMemo(() => {
            const hasFilter = searchTerm || filterMainCat !== '전체' || filterSubCat !== '전체' || filterItem !== '전체' || filterStart || filterEnd;
            if (hasFilter) return processedLedger;

            const now = new Date();
            const cutoff = new Date(now.getFullYear() - visibleYears, now.getMonth(), 1);
            const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}`;
            return processedLedger.filter(r => r.date >= cutoffStr);
        }, [processedLedger, visibleYears, searchTerm, filterMainCat, filterSubCat, filterItem, filterStart, filterEnd]);

        const tableContainerRef = useRef(null);
        useEffect(() => {
            const el = tableContainerRef.current;
            if (!el) return;
            const onScroll = () => {
                if (el.scrollTop + el.clientHeight >= el.scrollHeight - 100) {
                    setVisibleYears(prev => prev + 1);
                }
            };
            el.addEventListener('scroll', onScroll);
            return () => el.removeEventListener('scroll', onScroll);
        }, []);

        const summary = useMemo(() => {
            return processedLedger.reduce((acc, cur) => {
                acc.income += (cur.income || 0);
                acc.expense += (cur.expense || 0);
                return acc;
            }, { income: 0, expense: 0 });
        }, [processedLedger]);

        const rowsWithMonthlySettle = useMemo(() => {
            if (sortConfig.key !== 'date' && sortConfig.key !== 'date_income_expense') return visibleLedger;
            const result = [];
            let currentMonth = '';
            let monthIncome = 0;
            let monthExpense = 0;
            visibleLedger.forEach((r, idx) => {
                if (currentMonth !== '' && r.date !== currentMonth) {
                    result.push({ isSettle: true, date: currentMonth, income: monthIncome, expense: monthExpense });
                    monthIncome = 0; monthExpense = 0;
                }
                currentMonth = r.date;
                monthIncome += (r.income || 0);
                monthExpense += (r.expense || 0);
                result.push(r);
                if (idx === visibleLedger.length - 1) {
                    result.push({ isSettle: true, date: currentMonth, income: monthIncome, expense: monthExpense });

                                                    </select>

                                                <td className="p-1.5">

                                                <td className="p-1.5">
                                                    <input type="number" value={it.income} onChange={e => updateRegularItem(it.id, 'income', e.target.value)} className="w-28 p-1 border rounded text-[12px] text-right text-blue-600 font-bold" />
                                                </td>
                                                <td className="p-1.5">
                                                    <input type="number" value={it.expense} onChange={e => updateRegularItem(it.id, 'expense', e.target.value)} className="w-28 p-1 border rounded text-[12px] text-right text-red-600 font-bold" />
                                                </td>
                                                <td className="p-1.5 text-center">
                                                    <button onClick={() => deleteRegularItem(it.id)} className="text-red-400 hover:text-red-600"><Icon name="trash" /></button>
                                                </td>
                                            </tr>
                                        ))}

                                </table>
                                {regularItems.length === 0 && (
                                    <div className="p-8 text-center text-slate-300 font-bold">등록된 정기지출이 없습니다.</div>
                                )}
                            </div>
                            <div className="p-4 border-t flex justify-between items-center bg-slate-50">
                                <button onClick={addRegularItem} className="bg-indigo-500 text-white px-4 py-2 rounded-xl text-[12px] font-bold hover:bg-indigo-600">+ 항목 추가</button>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            if (confirm('기본 정기지출 목록으로 되돌립니까? 현재 편집한 내용은 사라집니다.')) {
                                                setRegularItems(DEFAULT_REGULAR_ITEMS.map((it, idx) => ({ ...it, id: `reg-${idx}-${Date.now()}` })));
                                            }
                                        }}
                                        className="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-[12px] font-bold hover:bg-slate-300"
                                    >
                                        기본값 복원
                                    </button>
                                    <button onClick={() => setShowRegularModal(false)} className="bg-slate-800 text-white px-6 py-2 rounded-xl text-[12px] font-bold">닫기</button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };
     
    const AssetFlowView = ({ data, setData, ledger, deviceView }) => {
        const loadIRPData = () => {
            if (!confirm('현재 기준 금융투자 정보를 불러오시겠습니까?')) return;
            
            try {
                const irpData = JSON.parse(localStorage.getItem('investmentToolData'));
                if (!irpData || !irpData.accounts) {
                    alert('IRP 데이터가 없습니다. 금융투자 탭에서 먼저 정보를 입력해주세요.');
                    return;
                }

                const dcAccount = irpData.accounts.find(a => a.name === "DC 연금 (미래에셋)" || a.name === "DC계좌 (미래에셋)");
                const irpAccount = irpData.accounts.find(a => a.name === "IRP 세액공제 (유안타)");
                const coinAccount = irpData.accounts.find(a => a.name === "코인");
                const isaAccount1 = irpData.accounts.find(a => a.name === "ISA (유안타)");
                const isaAccount2 = irpData.accounts.find(a => a.name === "ISA#2 (미래에셋)");

                const getAccountMetrics = (account) => {
                    if (!account) return { actualInv: 0, totalCurrent: 0 };
                    
                    const actualInv = account.actualInvestment != null ? account.actualInvestment : 0;
                    const totalCurrent = account.holdings.reduce((sum, h) => {
                        const price = irpData.prices[h.name] || 0;
                        return sum + (h.shares * price);
                    }, 0);
                    
                    return { actualInv, totalCurrent };
                };

                const dcMetrics = getAccountMetrics(dcAccount);
                const irpMetrics = getAccountMetrics(irpAccount);
                const coinMetrics = getAccountMetrics(coinAccount);
                const isa1Metrics = getAccountMetrics(isaAccount1);
                const isa2Metrics = getAccountMetrics(isaAccount2);

                setForm(prev => ({
                    ...prev,
                    cost_H_DC: String(Math.round(dcMetrics.actualInv / 10000)),
                    pension_H_DC: String(Math.round(dcMetrics.totalCurrent / 10000)),
                    
                    cost_H_IRP: String(Math.round(irpMetrics.actualInv / 10000)),
                    pension_H_IRP: String(Math.round(irpMetrics.totalCurrent / 10000)),
                    
                    cost_Crypto: String(Math.round(coinMetrics.actualInv / 10000)),
                    liq_Crypto: String(Math.round(coinMetrics.totalCurrent / 10000)),
                    
                    cost_H_Stock: String(Math.round(isa1Metrics.actualInv / 10000)),
                    liq_H_Stock: String(Math.round(isa1Metrics.totalCurrent / 10000)),
                    
                    cost_E_Stock: String(Math.round(isa2Metrics.actualInv / 10000)),
                    liq_E_Stock: String(Math.round(isa2Metrics.totalCurrent / 10000))
                }));

                alert('금융투자 정보를 불러왔습니다.');
            } catch (error) {
                console.error(error);
                alert('데이터를 불러오는 중 오류가 발생했습니다.');
            }
        };

        const getAdvancedStats = (record, allData) => {
            if (!record || !record.details) return { retainedEarnings: 0, propertyGain: 0, capital: 0 };
            const d = record.details;
            const n = (v) => Number(v) || 0;
            const recordDate = record.date;
            const [y, m] = recordDate.split('-').map(Number);
            let retainedEarnings = 0;
            const monthsSinceStart = (y - 2019) * 12 + (m - 12);
            if (monthsSinceStart >= 0) {
                retainedEarnings += Math.min(monthsSinceStart + 1, 72) * 125;
            }

            if (recordDate >= "2025-12") {
                const ledgerRental = ledger
                    .filter(l => l.date >= "2025-12" && l.date <= recordDate && l.subCat === "임대소득")
                    .reduce((sum, l) => sum + (l.income || 0), 0);
                const ledgerRentalExp = ledger
                    .filter(l => l.date >= "2025-12" && l.date <= recordDate && l.subCat === "임대지출")
                    .reduce((sum, l) => sum + (l.expense || 0), 0);
                const useLedger = ledgerRental > 0 || ledgerRentalExp > 0;
                if (recordDate >= "2023-01") {
                    retainedEarnings += 1000;
                }
                if (useLedger) {
                    retainedEarnings += Math.round((ledgerRental - ledgerRentalExp) / 10000);
                } else {
                    const pastRecords = allData.filter(item => item.date >= "2025-12" && item.date <= recordDate);
                    retainedEarnings += pastRecords.reduce((sum, r) => {
                        const det = r.details || {};
                        return sum + (n(det.rental_Income) - n(det.rental_Expense));
                    }, 0);
                }
                const penTotal = n(d.pension_H_DC) + n(d.pension_H_IRP) + n(d.pension_E_DC) + n(d.pension_E_IRP);
                const penCost = recordDate >= "2026-04"
                    ? (n(d.cost_H_DC) + n(d.cost_H_IRP) + n(d.cost_E_DC) + n(d.cost_E_IRP))
                    : (n(d.cost_H_Pen) + n(d.cost_E_Pen));
                retainedEarnings += penTotal - penCost;
                const finTotal = n(d.liq_Crypto) + n(d.liq_H_Stock) + n(d.liq_E_Stock);
                const finCost = recordDate >= "2026-04"
                    ? (n(d.cost_Crypto) + n(d.cost_H_Stock) + n(d.cost_E_Stock))
                    : n(d.cost_Finance);
                retainedEarnings += finTotal - finCost;
            }
            const DEFAULT_COSTS = { pungmu: 45335, bando: 35955, geomam: 49822 };
            const curPungmuCost = n(d.cost_Pungmu) || DEFAULT_COSTS.pungmu;
            const curBandoCost = n(d.cost_Bando) || DEFAULT_COSTS.bando;
            const curGeomamCost = n(d.cost_Geomam) || DEFAULT_COSTS.geomam;

            const propertyGain = (n(d.prop_Pungmu_Val) - curPungmuCost) +
                                (n(d.prop_Bando_Val) - curBandoCost) +
                                (n(d.prop_Geomam_Val) - curGeomamCost);
            const totalNetWorth = n(record.totalNetWorth);
            const capital = totalNetWorth - retainedEarnings - propertyGain;
            return { retainedEarnings, propertyGain, capital };
        };

        const [chartType, setChartType] = useState('area');
        const [dashboardMode, setDashboardMode] = useState('total');
        const [activeTab, setActiveTab] = useState('single');
        const [bulkText, setBulkText] = useState('');
        const [viewMode, setViewMode] = useState('list');
        const [selectedDetail, setSelectedDetail] = useState(null);
        const [statChartTarget, setStatChartTarget] = useState(null);
        const [showAmtGlobal, setShowAmtGlobal] = useState(false);
        const [comparePeriod, setComparePeriod] = useState(1);
        const [showProfit, setShowProfit] = useState(false);
        const statChartRef = useRef(null);
        const statChartInstance = useRef(null);

        const [form, setForm] = useState({
            date: '', residenceDeposit: '0',
            pension_H_DC: '0', pension_H_IRP: '0', pension_E_DC: '0', pension_E_IRP: '0',
            liq_H_KB: '0', liq_H_Yuanta: '0', liq_H_NZ: '190', liq_Couple: '800',
            liq_E_IM: '0', liq_E_K: '0', liq_E_MG: '0', liq_Crypto: '0',
            liq_H_Stock: '0', liq_E_Stock: '0',
            prop_Pungmu_Val: '0', prop_Pungmu_Dep: '31500',
            prop_Bando_Val: '0', prop_Bando_Loan: '10000',
            prop_Geomam_Val: '0',
            cost_H_Pen: '0', cost_E_Pen: '0',
            cost_Pungmu: '45335', cost_Bando: '35955', cost_Geomam: '49822',
            prop_Geomam_Loan: '29400', prop_Geomam_Dep: '5000', 
            prop_Masan_Share: '14000', prop_Ioniq_Val: '',
            liab_Bank_Loan: '39400', liab_Tenant_Dep: '36500', cap_Initial: '34700', note: '',
            cost_H_DC: '0', cost_H_IRP: '0', cost_E_DC: '0', cost_E_IRP: '0',
            cost_Crypto: '0', cost_H_Stock: '0', cost_E_Stock: '0',
        });

        useEffect(() => {
            const handleKeyDown = (e) => {
                if (e.key === 'Escape') {
                    if (statChartTarget) {
                        setStatChartTarget(null);
                    } else if (selectedDetail) {
                        setSelectedDetail(null);
                    }
                }
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
        }, [selectedDetail, statChartTarget]);

        useEffect(() => {
            const savedDraft = localStorage.getItem('asset_form_draft');
            if (savedDraft) {
                try { 
                    setForm(prev => ({
                        ...prev,
                        ...JSON.parse(savedDraft)
                    })); 
                } catch(e) {}
            }
        }, []);

        useEffect(() => {
            localStorage.setItem('asset_form_draft', JSON.stringify(form));
        }, [form]);

        const buildTimeSeries = (key) => {
            const sorted = [...data].sort((a, b) => a.date.localeCompare(b.date));
            const sliced = sorted.slice(-24);
            return sliced.map(r => {
                const det = r.details || {};
                const nn = (v) => Number(v) || 0;
                let resultValue = 0;
                switch (key) {
                    case 'pungmu': resultValue = nn(det.prop_Pungmu_Val); break;
                    case 'bando': resultValue = nn(det.prop_Bando_Val); break;
                    case 'geomam': resultValue = nn(det.prop_Geomam_Val); break;
                    case 'pen_h': resultValue = nn(det.pension_H_DC) + nn(det.pension_H_IRP); break;
                    case 'pen_e': resultValue = nn(det.pension_E_DC) + nn(det.pension_E_IRP); break;
                    case 'bank_loan': resultValue = nn(det.prop_Bando_Loan) + nn(det.prop_Geomam_Loan); break;
                    case 'tenant_dep': resultValue = nn(det.prop_Pungmu_Dep) + nn(det.prop_Geomam_Dep); break;
                    case 'capital': {
                        const advStats = getAdvancedStats(r, data);
                        resultValue = advStats.capital;
                        break;
                    }
                    case 'asset_gain': {
                        const advStats = getAdvancedStats(r, data);
                        resultValue = advStats.propertyGain;
                        break;
                    }
                    case 'retained': {
                        const advStats = getAdvancedStats(r, data);
                        resultValue = advStats.retainedEarnings;
                        break;
                    }
                    case 'financial_assets': {
                        const cash = nn(det.liq_H_KB) + nn(det.liq_H_Yuanta) + nn(det.liq_H_NZ) + nn(det.liq_Couple) + nn(det.liq_E_IM) + nn(det.liq_E_K) + nn(det.liq_E_MG);
                        const fin = nn(det.liq_Crypto) + nn(det.liq_H_Stock) + nn(det.liq_E_Stock);
                        const penVal = r.pension ? nn(r.pension) : (nn(det.pension_H_DC) + nn(det.pension_H_IRP) + nn(det.pension_E_DC) + nn(det.pension_E_IRP));
                        resultValue = cash + fin + penVal;
                        break;
                    }
                    case 'non_current': {
                        const cash = nn(det.liq_H_KB) + nn(det.liq_H_Yuanta) + nn(det.liq_H_NZ) + nn(det.liq_Couple) + nn(det.liq_E_IM) + nn(det.liq_E_K) + nn(det.liq_E_MG);
                        const fin = nn(det.liq_Crypto) + nn(det.liq_H_Stock) + nn(det.liq_E_Stock);
                        const penVal = r.pension ? nn(r.pension) : (nn(det.pension_H_DC) + nn(det.pension_H_IRP) + nn(det.pension_E_DC) + nn(det.pension_E_IRP));
                        const financialAssets = cash + fin + penVal;
                        const liab = nn(det.prop_Bando_Loan) + nn(det.prop_Geomam_Loan) + nn(det.prop_Pungmu_Dep) + nn(det.prop_Geomam_Dep);
                        const totalAssets = nn(r.totalNetWorth) + liab;
                        resultValue = totalAssets - financialAssets;
                        break;
                    }
                    case 'liabilities': {
                        resultValue = nn(det.prop_Bando_Loan) + nn(det.prop_Geomam_Loan) + nn(det.prop_Pungmu_Dep) + nn(det.prop_Geomam_Dep);
                        break;
                    }
                    case 'equity': {
                        resultValue = nn(r.totalNetWorth);
                        break;
                    }
                }
                return { label: r.date, value: resultValue };
            });
        };

        useEffect(() => {
            if (!statChartTarget) return;
            const ctx = statChartRef.current?.getContext('2d');
            if (!ctx || typeof Chart === 'undefined') return;
            if (statChartInstance.current) {
                statChartInstance.current.destroy();
            }
            const series = buildTimeSeries(statChartTarget.key);
            const labels = series.map(s => s.label);
            const values = series.map(s => s.value / 10000);

            const maxVal = Math.max(...values);
            const minVal = Math.min(...values);
            const range = maxVal - minVal;

            let yMin, yMax;
            if (range === 0) {
                yMin = Math.max(0, maxVal - 1);
                yMax = maxVal + 1;
            } else {
                const padding = range * 0.3;
                yMin = Math.max(0, minVal - padding);
                yMax = maxVal + padding;
            }

            statChartInstance.current = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: statChartTarget.label,
                        data: values,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.15)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2,
                        pointRadius: 2,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
                        y: {
                            min: yMin,
                            max: yMax,
                            grid: { color: '#e5e7eb' },
                            ticks: {
                                callback: v => typeof v === 'number' ? v.toFixed(1) + '억' : v + '억',
                                font: { size: 11 }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: ctx => `${ctx.parsed.y.toFixed(2)}억` } }
                    }
                }
            });
            return () => {
                if (statChartInstance.current) {
                    statChartInstance.current.destroy();
                }
            };
        }, [statChartTarget, data]);

        const calculated = useMemo(() => {
            const n = (val) => Number(val) || 0;
            const [y, m] = (form.date || "2026-04").split('-').map(Number);
            const pensionTotal = n(form.pension_H_DC) + n(form.pension_H_IRP) + n(form.pension_E_DC) + n(form.pension_E_IRP);
            const liquidTotal = n(form.liq_H_KB) + n(form.liq_H_Yuanta) + n(form.liq_H_NZ) + n(form.liq_Couple) + n(form.liq_E_IM) + n(form.liq_E_K) + n(form.liq_E_MG) + n(form.liq_Crypto) + n(form.liq_H_Stock) + n(form.liq_E_Stock);
            const propertyEquity = (n(form.prop_Pungmu_Val) - n(form.prop_Pungmu_Dep)) + (n(form.prop_Bando_Val) - n(form.prop_Bando_Loan)) + (n(form.prop_Geomam_Val) - n(form.prop_Geomam_Loan) - n(form.prop_Geomam_Dep));
            const fixedOthers = n(form.prop_Masan_Share) + n(form.prop_Ioniq_Val);
            const totalNetWorth = liquidTotal + propertyEquity + fixedOthers + pensionTotal + n(form.residenceDeposit);
            let retainedEarnings = 0;
            const monthsSinceStartFixed = (y - 2019) * 12 + (m - 12); 
            if (monthsSinceStartFixed >= 0) {
                retainedEarnings += Math.min(monthsSinceStartFixed + 1, 72) * 125;
            }

            if (form.date >= "2025-12") {
                const pastRentalSum = data
                    .filter(d => d.date >= "2025-12" && d.date < form.date)
                    .reduce((sum, r) => sum + (n(r.details?.rental_Income) - n(r.details?.rental_Expense)), 0);
                retainedEarnings += (pastRentalSum + (n(form.rental_Income) - n(form.rental_Expense)));
            }
            const pensionCostTotal = n(form.cost_H_DC) + n(form.cost_H_IRP) + n(form.cost_E_DC) + n(form.cost_E_IRP);
            const pensionProfit = pensionTotal - pensionCostTotal;
            retainedEarnings += pensionProfit; 
            const finAssetTotal = n(form.liq_Crypto) + n(form.liq_H_Stock) + n(form.liq_E_Stock);
            const finAssetCostTotal = n(form.cost_Crypto) + n(form.cost_H_Stock) + n(form.cost_E_Stock);
            retainedEarnings += finAssetTotal - finAssetCostTotal; 
            const propertyGain = (n(form.prop_Pungmu_Val) - n(form.cost_Pungmu)) + 
                                 (n(form.prop_Bando_Val) - n(form.cost_Bando)) + 
                                 (n(form.prop_Geomam_Val) - n(form.cost_Geomam));
            return { totalNetWorth, liquidTotal, propertyEquity, pensionTotal, fixedOthers, retainedEarnings, propertyGain };
        }, [form, data]);

        const handleAddRecord = (e) => {
            e.preventDefault();
            const record = {
                id: Date.now().toString(),
                date: normalizeDate(form.date),
                totalNetWorth: calculated.totalNetWorth,
                residentialDeposit: Number(form.residenceDeposit) || 0,
                pension: calculated.pensionTotal,
                note: form.note,
                details: { ...form },
            };
            setData(prev => {
                const combined = [...prev, record];
                const unique = Array.from(new Map(combined.map(item => [item.date, item])).values());
                return unique.sort((a, b) => b.date.localeCompare(a.date));
            });
            alert('저장되었습니다.');
        };

        const loadPastRecord = (record) => {
            if(record.details && confirm(`${record.date}의 세부 데이터를 입력창으로 불러올까요?`)) {
                setForm(prev => ({
                    ...prev,          
                    ...record.details 
                }));
                setActiveTab('single');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        const handleBulkSubmit = () => {
            try {
                const rows = bulkText.trim().split('\n');
                const records = [];
                const n = (v) => Number(v?.replace(/[^0-9.-]/g, '')) || 0;
                for (let row of rows) {
                    const cols = row.split(/[\t]/).map(c => c.trim());
                    if (cols.length < 5 || cols[0].includes("날짜")) continue;
                    const date = normalizeDate(cols[0]);
                    const d = {
                        date: date,
                        residenceDeposit: n(cols[1]),
                        pension_H_DC: n(cols[2]), pension_H_IRP: n(cols[3]),
                        pension_E_DC: n(cols[4]), pension_E_IRP: n(cols[5]),
                        liq_H_KB: n(cols[6]), liq_H_Yuanta: n(cols[7]), liq_H_NZ: n(cols[8]), liq_Couple: n(cols[9]),
                        liq_E_IM: n(cols[10]), liq_E_K: n(cols[11]), liq_E_MG: n(cols[12]),
                        liq_Crypto: n(cols[13]), liq_H_Stock: n(cols[14]), liq_E_Stock: n(cols[15]),
                        prop_Pungmu_Val: n(cols[16]), prop_Pungmu_Dep: n(cols[17]),
                        prop_Bando_Val: n(cols[18]), prop_Bando_Loan: n(cols[19]),
                        prop_Geomam_Val: n(cols[20]), prop_Geomam_Loan: n(cols[21]), prop_Geomam_Dep: n(cols[22]),
                        prop_Masan_Share: n(cols[23]), prop_Ioniq_Val: n(cols[24]),
                        cost_Pungmu: n(cols[25]),
                        cost_Bando: n(cols[26]),
                        cost_Geomam: n(cols[27]),
                        cost_H_Pen: n(cols[28]),
                        cost_E_Pen: n(cols[29]),
                        cap_Initial: n(cols[30]),
                        note: cols[31] || ''
                    };
                    const pensionTotal = d.pension_H_DC + d.pension_H_IRP + d.pension_E_DC + d.pension_E_IRP;
                    const liquidTotal = d.liq_H_KB + d.liq_H_Yuanta + d.liq_H_NZ + d.liq_Couple +
                                        d.liq_E_IM + d.liq_E_K + d.liq_E_MG + d.liq_Crypto + d.liq_H_Stock + d.liq_E_Stock;

                    <canvas ref={chartRef}></canvas>
                </div>
            </div>

    };
     
    const initialCards = [
        { name: "KB이지쇼핑 5062", class: "bg-blue-100", tiers: [50, 100, 150], isPerf: "O", curBenefit: 50, curTarget: 50, settings: {} },

        { name: "미스터라이프 2740", class: "bg-indigo-100", tiers: [30, 50, 100], isPerf: "O", curBenefit: 30, curTarget: 30, settings: {} },
        { name: "디카플랜+ 0802", class: "bg-slate-100", tiers: [40, 80, 120, 180], isPerf: "O", curBenefit: 80, curTarget: 80, settings: {} },
        { name: "새마을금고 체크", class: "bg-orange-100", tiers: [30], isPerf: "O", curBenefit: 30, curTarget: 30, settings: {} },

    initialCards.forEach(card => {

            });

    const CARDS_STORAGE_KEY = 'family_cards_v1';
    const CARD_HIST_STORAGE_KEY = 'family_card_hist_v1';
    const AUTO_PAY_STORAGE_KEY = 'family_auto_pay_v1';

const App = () => {
        const [mode, setMode] = useState('cards');
        const [deviceView, setDeviceView] = useState(() => {
            try {
                const saved = localStorage.getItem('roybin_deviceView');
                if (saved === 'mobile' || saved === 'pc') return saved;
            } catch (e) {}
            return (typeof window !== 'undefined' && window.innerWidth < 768) ? 'mobile' : 'pc';
        });
        useEffect(() => {
            try { localStorage.setItem('roybin_deviceView', deviceView); } catch (e) {}
        }, [deviceView]);

        // iframe(irp.html)에 deviceView 값 전달 (postMessage)
        const irpIframeRef = useRef(null);
        const sendDeviceViewToIrp = () => {
            try {
                if (irpIframeRef.current && irpIframeRef.current.contentWindow) {
                    irpIframeRef.current.contentWindow.postMessage({
                        type: 'setDeviceView',
                        deviceView: deviceView
                    }, '*');

            } catch (e) {}
        };

        useEffect(() => {
            sendDeviceViewToIrp();
        }, [deviceView]);

        const [manualDone, setManualDone] = useState({});
        const [ledger, setLedger] = useState([]);
        const [assetData, setAssetData] = useState([]);
        const [cards, setCards] = useState([]);
        const [cardHistory, setCardHistory] = useState([]);
        const [autoPayments, setAutoPayments] = useState([]);
        const [snapshots, setSnapshots] = useState({});
        const fileInputRef = useRef(null);

        // 자산현황 최신 레코드의 "재무상태표 현금성자산 합계" (KB+유안타+NZ+청약+IM+K뱅크+새마을신한) 를
        // 하나의 숫자로 iframe 에 전달 → 전체보유종목현황의 '현금성자산' 행에 사용
        const sendCashDataToIrp = () => {
            try {
                if (!irpIframeRef.current || !irpIframeRef.current.contentWindow) return;
                let cashTotal = 0;
                if (assetData && assetData.length > 0) {
                    const latest = [...assetData].sort((a, b) => b.date.localeCompare(a.date))[0];
                    const d = latest.details || {};
                    const n = (v) => Number(v) || 0;
                    const cashMan = n(d.liq_H_KB) + n(d.liq_H_Yuanta) + n(d.liq_H_NZ)
                                  + n(d.liq_Couple)
                                  + n(d.liq_E_IM) + n(d.liq_E_K) + n(d.liq_E_MG);
                    cashTotal = cashMan * 10000; // 만원 → 원
                }
                console.log('[CASH→IRP] 전송:', cashTotal, '원 (assetData 길이:', assetData?.length, ')');
                irpIframeRef.current.contentWindow.postMessage({
                    type: 'parentCashData',
                    cashTotal: Math.round(cashTotal)
                }, '*');
            } catch (e) { console.error('[CASH→IRP] 전송 실패:', e); }
        };

        useEffect(() => {
            // assetData 변경 시 현금 금액 재전송
            sendCashDataToIrp();
        }, [assetData]);
        useEffect(() => {
            // irpReady 메시지로 자식 준비 완료 신호 수신 → cash 즉시 전달
            const onCashMessage = (e) => {
                if (e.data && e.data.type === 'irpReady') {
                    sendCashDataToIrp();
                }
            };
            window.addEventListener('message', onCashMessage);
            return () => window.removeEventListener('message', onCashMessage);
        }, [assetData]);
        
        // 서버 동기화 상태 관리 변수 추가
        const [dataLoaded, setDataLoaded] = useState(false);
        const saveTimerRef = useRef(null);

        // 로딩 및 저장 상태 표시 인디케이터
        const showSavingIndicator = () => {

            if (!el) {
                el = document.createElement('div');
                el.id = '__familySavingIndicator';
                el.style.cssText = 'position:fixed;bottom:12px;right:12px;background:#1f2937;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;z-index:10000;opacity:0.9;';
                document.body.appendChild(el);
            }
            el.textContent = '⏳ 서버 저장 중...';
            el.style.background = '#1f2937';
        };

        const hideSavingIndicator = (text, isError) => {
            const el = document.getElementById('__familySavingIndicator');
            if (!el) return;
            el.textContent = text;
            el.style.background = isError ? '#b91c1c' : '#059669';
            setTimeout(() => {
                const up = document.getElementById('__familySavingIndicator');
                if (up) up.remove();
            }, 1500);
        };

        // 로컬스토리지 백업 데이터 로드 헬퍼
        const loadLocalStorageFallback = () => {
            const saved = localStorage.getItem('family_asset_flow_backup');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.ledger) setLedger(parsed.ledger);
                    if (parsed.assetFlow) setAssetData(parsed.assetFlow);
                    if (parsed.cards) setCards(parsed.cards);
                    if (parsed.cardHistory) setCardHistory(parsed.cardHistory);
                    if (parsed.autoPayments) setAutoPayments(parsed.autoPayments);
                    if (parsed.manualDone) setManualDone(parsed.manualDone);
                    if (parsed.snapshots) setSnapshots(parsed.snapshots);
                } catch (e) {}
            } else {
                setCards(initialCards);
            }
        };

  // 1. 초기 실행 시 서버에서 데이터 로드
        useEffect(() => {
            const loader = document.createElement('div');
            loader.id = '__familyLoader';
            loader.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#4f46e5;color:#fff;padding:8px;text-align:center;font-size:13px;z-index:10001;font-weight:bold;';
            loader.textContent = '⏳ 서버에서 가계부 데이터를 불러오는 중...';
            document.body.appendChild(loader);

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((serverData) => {
                        if (serverData) {
                            if (serverData.ledger) setLedger(serverData.ledger);
                            if (serverData.assetFlow) setAssetData(serverData.assetFlow);
                            if (serverData.cards) setCards(serverData.cards);
                            if (serverData.cardHistory) setCardHistory(serverData.cardHistory);
                            if (serverData.autoPayments) setAutoPayments(serverData.autoPayments);
                            if (serverData.manualDone) setManualDone(serverData.manualDone);
                            if (serverData.snapshots) setSnapshots(serverData.snapshots); // 👈 월별 스냅샷 서버 복구
                        } else {
                            loadLocalStorageFallback();
                        }
                        setDataLoaded(true);
                        const el = document.getElementById('__familyLoader');
                        if (el) el.remove();
                    })
                    .withFailureHandler((err) => {
                        console.error('서버 로드 실패:', err);
                        loadLocalStorageFallback();
                        setDataLoaded(true);

        // 2. 가계부 데이터 실시간 서버 및 로컬 자동 저장 (Debounce 적용)
useEffect(() => {

            autoPayments, 
            manualDone,

        };
            
            // 데이터 유실 방지용 로컬 스토리지 즉시 백업
            try {
                localStorage.setItem('family_asset_flow_backup', JSON.stringify(payload));
            } catch (e) {}
            
            // 서버 전송 과부하 방지를 위해 600ms 동안 추가 입력이 없을 때만 서버 저장 요청
