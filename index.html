            }, 600);
}, [ledger, assetData, cards, cardHistory, autoPayments, manualDone, snapshots, dataLoaded]); // 👈 오타 수정 완료!

        const exportToJson = async () => {
            const data = {
                ledger,
                assetFlow: assetData,
                cards,
                cardHistory,
                autoPayments,
                manualDone
            };
            const now = new Date();
            const f = (n) => String(n).padStart(2, '0');
            const YY = String(now.getFullYear()).slice(-2);
            const MM = f(now.getMonth() + 1);
            const DD = f(now.getDate());
            const HH = f(now.getHours());
            const mm = f(now.getMinutes());
            const fileName = `fam${YY}${MM}${DD}_${HH}${mm}.json`;
            const jsonStr = JSON.stringify(data, null, 2);
            
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(jsonStr);
                    await writable.close();
                    alert('모든 데이터가 안전하게 저장되었습니다.');
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                }
            } else {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                link.click();
            }
        };
const importFromJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const imported = JSON.parse(event.target.result);
                
                // 가계부 백업 JSON 데이터 양식 검증
                if (!imported.ledger && !imported.assetFlow) {
                    alert('올바른 가계부 백업 JSON 파일이 아닙니다.');
                    return;
                }

                if (confirm('기존 데이터를 완전히 지우고, 선택한 파일의 데이터로 서버 및 로컬 백업을 강제 복구하시겠습니까?')) {
                    
                    // 1. React 화면 상태 즉시 업데이트 (새로고침 없이 UI 반영)
                    if (imported.ledger) setLedger(imported.ledger);
                    if (imported.assetFlow) setAssetData(imported.assetFlow);
                    if (imported.cards) setCards(imported.cards);
                    if (imported.cardHistory) setCardHistory(imported.cardHistory);
                    if (imported.autoPayments) setAutoPayments(imported.autoPayments);
                    if (imported.manualDone) setManualDone(imported.manualDone);

                    // 2. 로컬 스토리지 즉시 강제 백업
                    localStorage.setItem('family_asset_flow_backup', JSON.stringify(imported));

                    // 3. 디바운싱 타이머를 우회하여 구글 스프레드시트 서버(A2)에 즉시 다이렉트 저장
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        showSavingIndicator();
                        google.script.run
                            .withSuccessHandler(() => {
                                hideSavingIndicator('✓ 서버 복구 완료');
                                alert('🎉 구글 서버 및 로컬 데이터 복구가 완벽히 완료되었습니다!');
                            })
.withFailureHandler((err) => {
    console.error('서버 복구 실패:', err);
    hideSavingIndicator('⚠ 서버 저장 실패', true);
    // 에러의 상세 원인(err.message)을 직접 경고창에 띄웁니다.
    alert('구글 서버 저장 실패 원인: ' + (err.message || err));
})
                            .saveFamilyDataToSheet(imported);
                    } else {
                        alert('오프라인 상태입니다. 기기 로컬 데이터만 우선 복구되었습니다.');
                    }
                }
            } catch (err) { 
                alert('파일을 읽는 과정에서 오류가 발생했습니다: ' + err.message); 
            }
        };
        reader.readAsText(file);
        e.target.value = ''; // 파일 입력 폼 초기화
    };

        return (
            <div className="min-h-screen flex flex-col font-medium">
                <header className={`bg-white border-b flex items-center justify-between px-6 sticky top-0 z-50 ${deviceView === 'mobile' ? 'h-24' : 'h-16'}`}>
                    <div className="flex items-center gap-8 font-bold">
                        <div className="flex items-center gap-2">
                            <div className="bg-slate-900 p-2 rounded-lg text-white font-bold"><Icon name="ledger" /></div>
                            <span className={`font-black text-slate-900 uppercase tracking-tighter ${deviceView === 'mobile' ? 'text-2xl' : 'text-xl'}`}>ROYBIN FAMILY</span>
                        </div>
                        <nav className={`flex gap-1 font-bold ${deviceView === 'mobile' ? 'h-24' : 'h-16'}`}>
                            <button onClick={() => setMode('cards')} className={`px-4 h-full font-bold border-b-2 transition-all ${deviceView === 'mobile' ? 'text-3xl' : 'text-sm'} ${mode==='cards'?'border-emerald-500 text-emerald-500':'border-transparent text-slate-400 hover:text-slate-600'}`}>카드관리</button>
                            <button onClick={() => setMode('ledger')} className={`px-4 h-full font-bold border-b-2 transition-all ${deviceView === 'mobile' ? 'text-3xl' : 'text-sm'} ${mode==='ledger'?'border-slate-900 text-slate-900':'border-transparent text-slate-400 hover:text-slate-600'}`}>가계부</button>
                            <button onClick={() => setMode('asset')} className={`px-4 h-full font-bold border-b-2 transition-all ${deviceView === 'mobile' ? 'text-3xl' : 'text-sm'} ${mode==='asset'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-400 hover:text-slate-600'}`}>자산현황</button>
                            <button onClick={() => setMode('investment')} className={`px-4 h-full font-bold border-b-2 transition-all ${deviceView === 'mobile' ? 'text-3xl' : 'text-sm'} ${mode==='investment'?'border-purple-600 text-purple-600':'border-transparent text-slate-400 hover:text-slate-600'}`}>금융투자</button>
                        </nav>
                    </div>
                    <div className="flex items-center gap-3">
                        <button
                            onClick={() => setDeviceView(v => v === 'pc' ? 'mobile' : 'pc')}
                            className={`font-bold rounded-lg ${deviceView === 'mobile' ? 'text-base px-4 py-3 bg-purple-100 text-purple-700 hover:bg-purple-200' : 'text-xs px-3 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            title={deviceView === 'pc' ? 'PC 화면 모드 (클릭: 모바일 전환)' : '모바일 화면 모드 (클릭: PC 전환)'}
                        >
                            {deviceView === 'mobile' ? '📱 Mobile' : '🖥️ PC'}
                        </button>
                        <input type="file" ref={fileInputRef} onChange={importFromJson} className="hidden" accept=".json" />
                    </div>
                </header>

                <main className={`flex-1 font-medium ${mode === 'investment' ? '' : 'py-6 max-w-[95%] mx-auto w-full'}`} style={mode === 'investment' ? {} : { marginTop: '-10px' }}>
                    {mode === 'ledger' && <MainLedgerView ledger={ledger} setLedger={setLedger} deviceView={deviceView} />}
                    {mode === 'asset' && <AssetFlowView data={assetData} setData={setAssetData} ledger={ledger} deviceView={deviceView} />}
{mode === 'cards' &&
    <CardBenefitView
        cards={cards} setCards={setCards}
        history={cardHistory} setHistory={setCardHistory}
        autoPayments={autoPayments} setAutoPayments={setAutoPayments}
        manualDone={manualDone} setManualDone={setManualDone}
        deviceView={deviceView}
        snapshots={snapshots} setSnapshots={setSnapshots} // 👈 이 2개 속성을 추가 전달해줘야 함![cite: 5]
    />
}
                    {/* IRP 화면: 항상 마운트해두고 display 로만 토글 → GitHub Pages에서는 irp.html 직접 로드 */}
                    <div style={{
                        width: '100%',
                        height: deviceView === 'mobile' ? 'calc(100vh - 96px)' : 'calc(100vh - 64px)',
                        display: mode === 'investment' ? 'block' : 'none'
                    }}>
                        <iframe
                            ref={irpIframeRef}
                            src="irp.html"
                            onLoad={() => {
                                sendDeviceViewToIrp();
                                sendCashDataToIrp();
                            }}
                            style={{
                                width: '100%',
                                height: '100%',
                                border: 'none',
                                display: 'block'
                            }}
                        ></iframe>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
